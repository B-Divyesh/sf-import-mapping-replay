[package]
name = "import-mapping-replay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Replay reviewed CSV mappings with field-level evidence"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-import-mapping-replay"
readme = "README.md"
keywords = ["csv", "import", "mapping", "validation", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "import-mapping-replay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
same-file = "1.0"

[dev-dependencies]
tempfile = "3.12"
